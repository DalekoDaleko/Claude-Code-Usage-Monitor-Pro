[package]
name = "claude-code-usage-monitor-pro"
version = "2.14.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Claude Code Usage Monitor Pro (unofficial fork)"
homepage = "https://github.com/DalekoDaleko/Claude-Code-Usage-Monitor-Pro"
# The updater derives its GitHub release-check URL from this field, so it must
# point at this fork rather than upstream.
repository = "https://github.com/DalekoDaleko/Claude-Code-Usage-Monitor-Pro"

# This is an unofficial fork. The executable must not present itself as a build
# published by Code Zeno Pty Ltd: Windows surfaces CompanyName in file
# properties and SmartScreen prompts. The MIT copyright notice for the original
# work is preserved here and in LICENSE.
[package.metadata.winres]
CompanyName = "Vitaliy Titov"
ProductName = "Claude Code Usage Monitor Pro"
FileDescription = "Claude Code Usage Monitor Pro (unofficial fork)"
OriginalFilename = "claude-code-usage-monitor-pro.exe"
InternalName = "ClaudeCodeUsageMonitor"
Comments = "Unofficial fork of Claude Code Usage Monitor by Craig Constable (Code Zeno Pty Ltd)"
LegalCopyright = "Copyright (C) 2025 Craig Constable. Fork modifications copyright (C) 2026 Vitaliy Titov. MIT licensed."

[dependencies]
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# The dashboard renders with Direct3D 12 through wgpu, built with that backend
# alone: no OpenGL, Vulkan or EGL code is compiled in. See studio_renderer.rs.
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"] }
egui_extras = { version = "0.36", features = ["svg"] }
lucide-icons = "1.30"
raw-window-handle = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
epaint_default_fonts = "0.36"
heck = "0.5"
lucide-icons = "1.30"
oxifont-subset = "0.2.2"
proc-macro2 = "1"
toml = "1.1"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
